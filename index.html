<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5ef" />
    <title>QuoteGen | Quote workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
    <style>
      .pricing-launcher {
        position: fixed;
        z-index: 10;
        right: 22px;
        bottom: 22px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid #193f35;
        border-radius: 6px;
        color: #fff;
        background: #245c4b;
        box-shadow: 0 5px 18px rgba(25, 63, 53, .2);
        font: 600 12px 'DM Sans', 'Segoe UI', sans-serif;
        text-decoration: none;
      }
      .pricing-launcher:hover { background: #193f35; }
      .pricing-launcher:focus-visible { outline: 3px solid #dceda7; outline-offset: 3px; }
      @media print { .pricing-launcher { display: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <a class="pricing-launcher" href="pricing.html" aria-label="Open the part pricing calculator">Part pricing calculator <span aria-hidden="true">↗</span></a>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
